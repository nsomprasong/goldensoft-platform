name: Publish image

# Build + push GHCR only. Never SSH, never compose, never touch VPS.
on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: "Full commit SHA to build (image tag = first 12 chars). Empty = this workflow commit."
        required: false
        default: ""

env:
  IMAGE_NAME: goldensoft-platform
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      image_ref: ${{ steps.meta.outputs.ref }}
    steps:
      - name: Resolve source commit
        id: meta
        run: |
          set -euo pipefail
          SHA="${{ inputs.git_sha }}"
          if [ -z "$SHA" ]; then
            SHA="${GITHUB_SHA}"
          fi
          TAG="${SHA::12}"
          echo "full_sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building ${TAG} from ${SHA}"

      - name: Checkout source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.full_sha }}

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (no deploy)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:sha-${{ steps.meta.outputs.full_sha }}
          build-args: |
            IMAGE_TAG=${{ steps.meta.outputs.tag }}

      - name: Confirm pushed tags
        run: |
          echo "Pushed ${{ steps.meta.outputs.ref }}"
          echo "Also tagged sha-${{ steps.meta.outputs.full_sha }}"
