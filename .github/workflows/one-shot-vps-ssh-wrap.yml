name: One-shot VPS SSH wrap
on:
  workflow_dispatch:
    inputs:
      client_pubkey:
        required: true
jobs:
  wrap:
    runs-on: ubuntu-latest
    steps:
      - env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_COMPOSE_DIR: ${{ secrets.VPS_COMPOSE_DIR }}
          CLIENT_PUBKEY: ${{ inputs.client_pubkey }}
        run: |
          set -euo pipefail
          printf '%s\n' "$CLIENT_PUBKEY" > /tmp/client.pub
          printf '%s\n' "$VPS_HOST" > /tmp/host.txt
          printf '%s\n' "$VPS_USER" > /tmp/user.txt
          printf '%s\n' "$VPS_COMPOSE_DIR" > /tmp/compose_dir.txt
          printf '%s\n' "$VPS_SSH_KEY" > /tmp/key.pem
          openssl rand -out /tmp/sym.bin 32
          openssl enc -aes-256-cbc -salt -pbkdf2 -in /tmp/key.pem -out /tmp/key.enc -pass file:/tmp/sym.bin
          openssl pkeyutl -encrypt -pubin -inkey /tmp/client.pub -pkeyopt rsa_padding_mode:oaep -in /tmp/sym.bin -out /tmp/sym.enc
          mkdir -p /tmp/bundle
          cp /tmp/host.txt /tmp/user.txt /tmp/compose_dir.txt /tmp/key.enc /tmp/sym.enc /tmp/bundle/
          tar -C /tmp/bundle -czf /tmp/vps-ssh-bundle.tgz .
          shred -u /tmp/key.pem /tmp/sym.bin || rm -f /tmp/key.pem /tmp/sym.bin
      - uses: actions/upload-artifact@v4
        with:
          name: vps-ssh-bundle
          path: /tmp/vps-ssh-bundle.tgz
          retention-days: 1
