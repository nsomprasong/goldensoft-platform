name: Deploy

on:
  workflow_dispatch:
    inputs:
      triggered_by:
        description: "Caller id"
        required: false
        default: "manual"

env:
  IMAGE_NAME: goldensoft-platform
  COMPOSE_SERVICE: goldensoft-platform
  CONTAINER_NAME: goldensoft-platform
  IMAGE_TAG_ENV: PLATFORM_IMAGE_TAG
  HEALTH_URL: https://platform.goldensoft.cloud/api/health
  REGISTRY: ghcr.io

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build-and-push:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Immutable image tag from commit SHA
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (GitHub runners only — never on VPS)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'https://platform.goldensoft.cloud' }}
            IMAGE_TAG=${{ steps.meta.outputs.tag }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Stagger SSH (avoid concurrent dial storms across products)
        run: sleep 4

      - name: Prepare SSH key file
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > "$HOME/.ssh/gs_deploy"
          chmod 600 "$HOME/.ssh/gs_deploy"
          printf 'Host gs-vps\n  HostName %s\n  User %s\n  IdentityFile %s\n  IdentitiesOnly yes\n  AddressFamily inet\n  StrictHostKeyChecking accept-new\n  ConnectTimeout 30\n  ServerAliveInterval 15\n  ServerAliveCountMax 3\n' \
            "${{ secrets.VPS_HOST }}" \
            "${{ secrets.VPS_USER }}" \
            "$HOME/.ssh/gs_deploy" > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

      - name: Deploy via SSH (pull + compose only)
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          GHCR_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG_ENV: ${{ env.IMAGE_TAG_ENV }}
          COMPOSE_SERVICE: ${{ env.COMPOSE_SERVICE }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          COMPOSE_DIR: ${{ secrets.VPS_COMPOSE_DIR }}
        run: |
          set -euo pipefail
          attempt=1
          while [ "$attempt" -le 6 ]; do
            echo "SSH deploy attempt ${attempt}/6"
            if ssh -F "$HOME/.ssh/config" gs-vps bash -s <<EOF
          set -euo pipefail
          # Safety: never prune volumes; never touch resident-app / n8n.
          export GHCR_TOKEN=$(printf %q "$GHCR_TOKEN")
          export IMAGE_TAG=$(printf %q "$IMAGE_TAG")
          export GHCR_OWNER=$(printf %q "$GHCR_OWNER")
          export IMAGE_TAG_ENV=$(printf %q "$IMAGE_TAG_ENV")
          export COMPOSE_SERVICE=$(printf %q "$COMPOSE_SERVICE")
          export CONTAINER_NAME=$(printf %q "$CONTAINER_NAME")
          export COMPOSE_DIR=$(printf %q "$COMPOSE_DIR")
          cd "\$COMPOSE_DIR"
          PREV=\$(docker inspect -f '{{ index .Config.Image }}' "\$CONTAINER_NAME" 2>/dev/null || true)
          export "\${IMAGE_TAG_ENV}=\${IMAGE_TAG}"
          export GHCR_OWNER
          touch .env
          grep -v "^\${IMAGE_TAG_ENV}=" .env > .env.tmp || true
          echo "\${IMAGE_TAG_ENV}=\${IMAGE_TAG}" >> .env.tmp
          mv .env.tmp .env
          if ! docker compose -f docker-compose.yml pull "\$COMPOSE_SERVICE"; then
            echo "\$GHCR_TOKEN" | docker login ghcr.io -u "\$GHCR_OWNER" --password-stdin
            docker compose -f docker-compose.yml pull "\$COMPOSE_SERVICE"
          fi
          docker compose -f docker-compose.yml up -d --no-deps "\$COMPOSE_SERVICE"
          echo "PREV_IMAGE=\${PREV}" > "/tmp/gs-prev-\${COMPOSE_SERVICE}.txt"
          EOF
            then
              exit 0
            fi
            attempt=$((attempt + 1))
            sleep 20
          done
          exit 1

      - name: Health check
        id: health
        continue-on-error: true
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "${{ env.HEALTH_URL }}" | grep -q '"ok":true'; then
              exit 0
            fi
            sleep 6
          done
          exit 1

      - name: Rollback previous immutable image tag
        if: steps.health.outcome == 'failure'
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG_ENV: ${{ env.IMAGE_TAG_ENV }}
          COMPOSE_SERVICE: ${{ env.COMPOSE_SERVICE }}
          COMPOSE_DIR: ${{ secrets.VPS_COMPOSE_DIR }}
        run: |
          set -euo pipefail
          attempt=1
          while [ "$attempt" -le 3 ]; do
            echo "SSH rollback attempt ${attempt}/3"
            if ssh -F "$HOME/.ssh/config" gs-vps bash -s <<EOF
          set -euo pipefail
          export GHCR_TOKEN=$(printf %q "$GHCR_TOKEN")
          export GHCR_OWNER=$(printf %q "$GHCR_OWNER")
          export IMAGE_TAG_ENV=$(printf %q "$IMAGE_TAG_ENV")
          export COMPOSE_SERVICE=$(printf %q "$COMPOSE_SERVICE")
          export COMPOSE_DIR=$(printf %q "$COMPOSE_DIR")
          cd "\$COMPOSE_DIR"
          PREV_FILE="/tmp/gs-prev-\${COMPOSE_SERVICE}.txt"
          if [ ! -f "\$PREV_FILE" ]; then
            echo "No previous image recorded; cannot rollback"
            exit 1
          fi
          # shellcheck disable=SC1090
          . "\$PREV_FILE"
          if [ -z "\${PREV_IMAGE:-}" ]; then
            echo "Previous image empty; cannot rollback"
            exit 1
          fi
          echo "\$GHCR_TOKEN" | docker login ghcr.io -u "\$GHCR_OWNER" --password-stdin
          docker pull "\$PREV_IMAGE"
          PREV_TAG="\${PREV_IMAGE##*:}"
          case "\$PREV_TAG" in
            latest|rollback|"")
              echo "Refusing rollback to non-immutable tag: \${PREV_TAG}"
              exit 1
              ;;
          esac
          export "\${IMAGE_TAG_ENV}=\${PREV_TAG}"
          export GHCR_OWNER
          touch .env
          grep -v "^\${IMAGE_TAG_ENV}=" .env > .env.tmp || true
          echo "\${IMAGE_TAG_ENV}=\${PREV_TAG}" >> .env.tmp
          mv .env.tmp .env
          docker compose -f docker-compose.yml up -d --no-deps "\$COMPOSE_SERVICE"
          EOF
            then
              exit 0
            fi
            attempt=$((attempt + 1))
            sleep 15
          done
          exit 1

      - name: Fail job if unhealthy
        if: steps.health.outcome == 'failure'
        run: exit 1
